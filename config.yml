# Source data locations read by the pipeline. run_all.R loads this file into
# `config` (read_config() in R/config.R); scripts use config$data_sources$<name>.
# Edit a link here when a source file is replaced; no code change is needed.

data_sources:
  # Google Sheet "Brodie_EBI_Greenhouse_PiccaroMeasurement_2026": chamber start
  # and end times, LightDark_Measurment tab (Light and Dark windows)
  metadata_sheet: "https://docs.google.com/spreadsheets/d/1mEHIjlCxUYlHyZAtM29sMYMGwfevLKi1IuZGaYqSyfw"

  # Same Sheet, After_WateringMeasurment tab (After-watering windows)
  afterwatering_sheet: "https://docs.google.com/spreadsheets/d/1mEHIjlCxUYlHyZAtM29sMYMGwfevLKi1IuZGaYqSyfw/edit?gid=1522788687#gid=1522788687"

  # Same Sheet, pH_EC_EndPoint_July2026 tab: end-point measurements for each pot
  # (pH, EC, shoots, chlorophyll, dry weights, water use, phosphate, NH4-N,
  # organic carbon). Shoot dry weight is used for water use efficiency.
  endpoint_sheet: "https://docs.google.com/spreadsheets/d/1mEHIjlCxUYlHyZAtM29sMYMGwfevLKi1IuZGaYqSyfw/edit?gid=1834588341#gid=1834588341"

  # Same Sheet, Raw_Plant_Measurements_Shoot_Chlorophyll tab: shoot count and
  # height (7 shoots, R1-R7) and chlorophyll index (Leaf_1-Leaf_6) per pot on
  # 6 dates (2026-04-09 to 2026-05-26), with per-pot averages. The pipeline
  # averages the raw readings itself and ignores Leaf_6 (wrong on 2026-04-09).
  plant_measurements_sheet: "https://docs.google.com/spreadsheets/d/1mEHIjlCxUYlHyZAtM29sMYMGwfevLKi1IuZGaYqSyfw/edit?gid=1757147146#gid=1757147146"

  # Greenhouse_Temperature.csv on Google Drive: indoor temperature, relative
  # humidity and PAR light, 2026-03-01 to 2026-05-30
  greenhouse_log: "https://drive.google.com/file/d/184jLi4XAqnDkcbxAWHGWeuM4ZFq0i-6E"
